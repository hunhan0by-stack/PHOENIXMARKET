# Render Blueprint - deploy from repo root
# Required env: SECRET_KEY (generated), ITEMSATIS_REDIRECT_URL, ADMIN_USERNAME, ADMIN_PASSWORD (12+ chars)
# Optional: OPENAI_API_KEY (AI answers in the support chat; FAQ answers otherwise)
# Optional: SMTP_HOST, SMTP_PORT (587), SMTP_USER, SMTP_PASSWORD, MAIL_FROM, SMTP_SSL (for 465),
#           SMTP_STARTTLS – deliver order/reset emails; without them emails appear under Admin → Emails
# Optional: TRUSTED_HOSTS (e.g. "shop.example,www.shop.example"),
#           PENDING_ORDER_TTL_HOURS, DELIVERY_RETENTION_DAYS, OUTBOX_RETENTION_DAYS
# Keep --workers 1: login/checkout/chat rate limits are kept in process memory.
#
# Persistent data: Render resets the service filesystem on every deploy and
# restart. The disk below (paid instance types only) keeps the database,
# uploaded images and the daily backups. The app refuses to start on Render
# without DATABASE_PATH, and the admin dashboard warns while the database
# folder is not on a mounted disk. A disk lives in one region and is not an
# off-site backup: download copies regularly (README, "Backups").
services:
  - type: web
    name: phoenixmarket
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /health
    disk:
      name: phoenixmarket-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ITEMSATIS_REDIRECT_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /var/data/phoenixmarket.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: BACKUP_DIR
        value: /var/data/backups
      # Turkish-first: language for first-time visitors and search engines
      - key: DEFAULT_LOCALE
        value: tr
