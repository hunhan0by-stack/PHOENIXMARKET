{% extends "base.html" %}
{% block title %}{{ t('reset_title') }} – PHOENIXMARKET{% endblock %}
{% block content %}
<section class="bg-slate-950/90">
  <div class="mx-auto max-w-sm px-4 py-14 sm:px-6 lg:px-8">
    <p class="text-xs font-semibold uppercase tracking-[0.25em] text-brandOrange">
      {{ t('forgot_kicker') }}
    </p>
    <h1 class="mt-1 text-2xl font-semibold tracking-tight text-slate-50">
      {{ t('reset_title') }}
    </h1>

    <form method="post" action="{{ url_for('account.reset_password', token=token) }}" class="mt-6 space-y-4">
      {{ csrf_field() }}
      <div>
        <label for="f-password" class="block text-xs font-medium text-slate-300 mb-1">{{ t('account_new_password') }}</label>
        <input id="f-password" type="password" name="password" minlength="{{ MIN_PASSWORD_LENGTH }}" autocomplete="new-password" class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100 focus:border-brandOrange focus:outline-none" required>
        <p class="mt-1 text-[11px] text-slate-500">{{ t('password_hint').format(n=MIN_PASSWORD_LENGTH) }}</p>
      </div>
      <div>
        <label for="f-confirm-password" class="block text-xs font-medium text-slate-300 mb-1">{{ t('account_confirm_new_password') }}</label>
        <input id="f-confirm-password" type="password" name="confirm_password" minlength="{{ MIN_PASSWORD_LENGTH }}" autocomplete="new-password" class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100 focus:border-brandOrange focus:outline-none" required>
      </div>
      <button type="submit" class="w-full rounded-full bg-gradient-to-r from-brandRed to-brandOrange px-4 py-2.5 text-sm font-semibold text-black">
        {{ t('reset_button') }}
      </button>
    </form>
  </div>
</section>
{% endblock %}
