{% extends "base.html" %}
{% block title %}{{ t('error_title') }} – PHOENIXMARKET{% endblock %}
{% block content %}
<section class="bg-slate-950/90">
  <div class="mx-auto max-w-xl px-4 py-24 sm:px-6 lg:px-8 text-center">
    <p class="text-xs font-semibold uppercase tracking-[0.25em] text-brandOrange">
      500
    </p>
    <h1 class="mt-2 text-3xl font-semibold tracking-tight text-slate-50 sm:text-4xl">
      {{ t('error_heading') }}
    </h1>
    <p class="mt-3 text-sm text-slate-400">
      {{ t('error_body') }}
    </p>
    <div class="mt-6 flex flex-wrap justify-center gap-3 text-xs">
      <a href="{{ url_for('shop.index') }}" class="rounded-full bg-gradient-to-r from-brandRed to-brandOrange px-5 py-2 font-semibold text-black">
        {{ t('notfound_home') }}
      </a>
      <a href="{{ url_for('shop.contact') }}" class="rounded-full border border-slate-700 px-5 py-2 text-slate-200 hover:border-brandOrange hover:text-brandOrange">
        {{ t('nav_contact') }}
      </a>
    </div>
  </div>
</section>
{% endblock %}
