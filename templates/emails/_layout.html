<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# The design is already dark: keep mail apps from inverting it #}
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>PHOENIXMARKET</title>
</head>
<body style="margin:0;padding:0;background:#020617;font-family:Arial,Helvetica,sans-serif;color:#e2e8f0;">
  {# Preview line shown next to the subject in the inbox (not displayed in the message) #}
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">{% block preheader %}{% endblock %}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#020617;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#0f172a;border:1px solid #1f2937;border-radius:16px;">
          <tr>
            <td style="padding:24px 28px 8px;font-size:13px;font-weight:bold;letter-spacing:4px;color:#f97316;">PHOENIXMARKET</td>
          </tr>
          <tr>
            <td style="padding:8px 28px 24px;font-size:14px;line-height:1.6;color:#e2e8f0;">
              {% block body %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px;border-top:1px solid #1f2937;font-size:11px;color:#64748b;">{{ t('email_footer') }}</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
