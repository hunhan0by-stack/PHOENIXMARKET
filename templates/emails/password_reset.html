{% extends "emails/_layout.html" %}
{% block body %}
  <h1 style="margin:0 0 12px;font-size:20px;color:#f8fafc;">{{ t('email_reset_subject') }}</h1>
  <p style="margin:0 0 16px;color:#cbd5e1;">{{ t('email_reset_intro') }}</p>
  <p style="margin:20px 0;">
    <a href="{{ reset_url }}" style="display:inline-block;background:#f97316;color:#020617;text-decoration:none;font-weight:bold;padding:10px 20px;border-radius:999px;">{{ t('email_reset_cta') }}</a>
  </p>
  <p style="margin:0 0 8px;font-size:12px;color:#64748b;word-break:break-all;">{{ reset_url }}</p>
  <p style="margin:16px 0 0;font-size:12px;color:#64748b;">{{ t('email_reset_ignore') }}</p>
{% endblock %}
