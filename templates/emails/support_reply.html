{% extends "emails/_layout.html" %}
{% block body %}
  <p style="margin:0 0 12px;color:#94a3b8;">{{ t('email_support_reply_intro') }}</p>
  <p style="margin:0 0 20px;white-space:pre-line;color:#f8fafc;">{{ message.admin_reply }}</p>
  <p style="margin:0 0 4px;font-size:12px;color:#64748b;">{{ t('email_support_original') }}:</p>
  <blockquote style="margin:0;padding:8px 12px;border-left:3px solid #1f2937;font-size:12px;color:#94a3b8;white-space:pre-line;">{{ message.message }}</blockquote>
{% endblock %}
