{# Coupon create/edit form. Import with: {% from "_coupon_form.html" import coupon_form with context %}
   form: string values (see views.admin.coupon_form_values). #}
{% macro coupon_form(form, action, submit_label) %}
  <form method="post" action="{{ action }}" class="space-y-3 rounded-2xl border border-slate-800 bg-slate-950/80 p-5 text-sm">
    {{ csrf_field() }}
    <div>
      <label for="coupon-code" class="block text-xs font-medium text-slate-300 mb-1">{{ t('adm_code') }}</label>
      <input id="coupon-code" type="text" name="code" value="{{ form.code }}" maxlength="32" pattern="[A-Za-z0-9_\-]{3,32}" required class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 font-mono text-sm uppercase text-slate-100 focus:border-brandOrange focus:outline-none" placeholder="WELCOME10">
      <p class="mt-1 text-[11px] text-slate-500">{{ t('adm_code_hint') }}</p>
    </div>
    <div class="grid gap-3 sm:grid-cols-2">
      <div>
        <label for="coupon-kind" class="block text-xs font-medium text-slate-300 mb-1">{{ t('adm_type') }}</label>
        <select id="coupon-kind" name="kind" class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100 focus:border-brandOrange focus:outline-none">
          <option value="percent" {% if form.kind == 'percent' %}selected{% endif %}>{{ t('adm_kind_percent') }}</option>
          <option value="fixed" {% if form.kind == 'fixed' %}selected{% endif %}>{{ t('adm_kind_fixed') }}</option>
        </select>
      </div>
      <div>
        <label for="coupon-value" class="block text-xs font-medium text-slate-300 mb-1">{{ t('adm_value') }}</label>
        <input id="coupon-value" type="number" name="value" value="{{ form.value }}" step="0.01" min="0.01" required class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100 focus:border-brandOrange focus:outline-none">
      </div>
      <div>
        <label for="coupon-min" class="block text-xs font-medium text-slate-300 mb-1">{{ t('adm_min_order_usd') }}</label>
        <input id="coupon-min" type="number" name="min_order_usd" value="{{ form.min_order_usd }}" step="0.01" min="0" class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100 focus:border-brandOrange focus:outline-none">
      </div>
      <div>
        <label for="coupon-max" class="block text-xs font-medium text-slate-300 mb-1">{{ t('adm_max_uses') }}</label>
        <input id="coupon-max" type="number" name="max_uses" value="{{ form.max_uses }}" step="1" min="1" class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100 focus:border-brandOrange focus:outline-none">
      </div>
      <div>
        <label for="coupon-start" class="block text-xs font-medium text-slate-300 mb-1">{{ t('adm_valid_from') }}</label>
        <input id="coupon-start" type="date" name="starts_at" value="{{ form.starts_at }}" class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100 focus:border-brandOrange focus:outline-none">
      </div>
      <div>
        <label for="coupon-end" class="block text-xs font-medium text-slate-300 mb-1">{{ t('adm_valid_until') }}</label>
        <input id="coupon-end" type="date" name="expires_at" value="{{ form.expires_at }}" class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100 focus:border-brandOrange focus:outline-none">
      </div>
    </div>
    <label class="flex items-center gap-2 text-xs text-slate-300">
      <input type="checkbox" name="active" value="1" {% if form.active %}checked{% endif %} class="h-4 w-4 rounded border-slate-600 bg-slate-900 accent-orange-500">
      {{ t('admin_status_active') }}
    </label>
    <button type="submit" class="w-full rounded-full bg-gradient-to-r from-brandRed to-brandOrange px-4 py-2 text-xs font-semibold text-black">{{ submit_label }}</button>
  </form>
{% endmacro %}
